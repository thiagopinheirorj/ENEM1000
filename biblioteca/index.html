<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Português Pronto · Biblioteca do Professor</title>
<meta name="description" content="Atividades, provas, slides, mapas mentais e simulados de Português, Redação e Literatura, prontos para imprimir ou projetar.">
<meta name="theme-color" content="#2f3b21">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<style>
/* Biblioteca do Professor: vitrine (busca, pastas, filtros) + leitor (folha impressa, slides, mapa mental). */
:root{
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:#f6f0df; --bg2:#ece3c6;
  --card:#fffaf0; --card2:#fbf3de;
  --ink:#26301a; --muted:#5a6346; --line:rgba(47,59,33,.2);
  --olive:#2f3b21; --olive2:#46552f; --on-olive:#f6f0df;
  --gold:#d9ab3a; --gold-soft:#f1dc9a; --gold-ink:#5b4408;
  --ok:#3f6b2a; --ok-bg:#e9f2d9;
  --sombra:0 1px 2px rgba(38,48,26,.08),0 8px 24px rgba(38,48,26,.08);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151a10; --bg2:#1d2415;
    --card:#222a18; --card2:#2a3320;
    --ink:#f1ead2; --muted:#c3c7ae; --line:rgba(241,234,210,.2);
    --olive:#2f3b21; --olive2:#5a6d3a; --on-olive:#f6f0df;
    --gold:#e4b94d; --gold-soft:#5b4a14; --gold-ink:#f1dc9a;
    --ok:#9fd07a; --ok-bg:#2b3a1d;
    --sombra:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);background-image:linear-gradient(180deg,var(--bg) 0,var(--bg2) 100%);background-attachment:fixed;line-height:1.5;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
.skip{position:absolute;left:-999px;top:0;background:var(--olive);color:var(--on-olive);padding:.6rem 1rem;z-index:50}
.skip:focus{left:8px;top:8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* ---------- Topo e herói ---------- */
.topo{padding:18px 0 0}
.marca{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:1.15rem;letter-spacing:.01em}
.marca svg{flex:none}
.selo{margin:16px auto 0;max-width:640px;border:2px solid var(--gold);border-radius:999px;padding:10px 20px;text-align:center;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.hero{text-align:center;padding:26px 0 10px}
.hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(1.9rem,6.4vw,3.2rem);line-height:1.1;margin:0 auto;max-width:780px;text-wrap:balance}
.hero h1 mark{background:linear-gradient(transparent 64%,var(--gold-soft) 64%);color:inherit;padding:0 .1em}
.hero p{max-width:640px;margin:16px auto 0;font-size:1.05rem;color:var(--muted)}
.hero p strong{color:var(--ink)}
.beneficios{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;list-style:none;padding:0;margin:18px 0 0}
.beneficios li{background:var(--olive);color:var(--on-olive);border-radius:999px;padding:6px 14px;font-size:.82rem;font-weight:600}

/* ---------- Vitrine (busca, pastas, filtros) ---------- */
.vitrine{margin:22px 0 8px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--sombra)}
.busca{position:relative}
.busca input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px 12px 42px;font-size:1rem}
.busca input::placeholder{color:var(--muted)}
.busca svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.pastas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media (min-width:640px){.pastas{grid-template-columns:repeat(4,1fr)}}
.pasta{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:1.5px solid color-mix(in srgb,var(--gold) 60%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 38%,var(--card)),color-mix(in srgb,var(--gold) 20%,var(--card)));border-radius:14px;padding:14px 8px 10px;color:var(--ink)}
.pasta::before{content:"";position:absolute;left:10px;top:-7px;width:44%;height:8px;border-radius:6px 6px 0 0;background:color-mix(in srgb,var(--gold) 60%,transparent)}
.pasta .n{font-size:.74rem;color:var(--muted);font-weight:600}
.pasta .t{font-weight:700;font-size:.92rem;line-height:1.2}
.pasta[aria-pressed="true"]{background:var(--olive);color:var(--on-olive);border-color:var(--olive)}
.pasta[aria-pressed="true"] .n{color:var(--gold-soft)}
.pasta[aria-pressed="true"]::before{background:var(--olive2)}
@media (prefers-color-scheme: dark){.pasta[aria-pressed="true"] .n{color:var(--gold)}}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.pilulas{display:flex;flex-wrap:wrap;gap:6px}
.pilula,.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:600;min-height:36px}
.pilula[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.filtros select{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;min-height:36px;font-size:.88rem;font-weight:600}
.limpar{border:0;background:none;text-decoration:underline;color:var(--muted);font-size:.88rem;padding:6px}

/* ---------- Lista ---------- */
.resultados{padding:14px 0 40px}
.cont{font-family:var(--serif);font-size:1.25rem;margin:10px 2px 12px}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:760px){.lista{grid-template-columns:1fr 1fr}}
.item{position:relative}
.card{display:flex;gap:12px;align-items:flex-start;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 52px 14px 14px;height:100%;box-shadow:var(--sombra)}
.card:hover{border-color:var(--olive2)}
.ic{flex:none;width:46px;height:46px;border-radius:12px;background:var(--gold);color:var(--olive);display:grid;place-items:center}
.card .tit{display:block;font-family:var(--serif);font-weight:700;font-size:1.05rem;line-height:1.25}
.card .res{display:block;font-size:.88rem;color:var(--muted);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tags span{font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--card2);border:1px solid var(--line);color:var(--ink)}
.tags span:first-child{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.fav{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.fav[aria-pressed="true"]{color:var(--gold)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.vazio{text-align:center;padding:36px 12px;background:var(--card);border:1px dashed var(--line);border-radius:16px}
.vazio p{margin:0 0 12px;color:var(--muted)}
.btn{border:1.5px solid var(--olive);background:var(--olive);color:var(--on-olive);border-radius:10px;padding:8px 16px;font-weight:700;min-height:40px}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.rodape{border-top:1px solid var(--line);padding:18px 0 40px;font-size:.8rem;color:var(--muted)}
.rodape p{margin:4px 0}

/* ---------- Leitor ---------- */
.barra{position:sticky;top:0;z-index:20;background:var(--olive);color:var(--on-olive);padding:8px 0;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.barra .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.voltar{color:var(--on-olive);text-decoration:none;font-weight:700;padding:8px 6px;min-height:40px;display:inline-flex;align-items:center}
.acoes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acoes button,.acoes .chave{border:1.5px solid rgba(246,240,223,.45);background:transparent;color:var(--on-olive);border-radius:10px;padding:6px 12px;font-size:.88rem;font-weight:600;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.acoes button.prim{background:var(--gold);border-color:var(--gold);color:#2b2200}
.acoes button[aria-pressed="true"],.acoes .chave.on{background:var(--gold-soft);color:#2b2200;border-color:var(--gold-soft)}
.acoes .chave{cursor:pointer}
.acoes .chave input{accent-color:#d9ab3a;width:16px;height:16px;margin:0}
.aviso-edicao{background:var(--gold-soft);color:#2b2200;padding:8px 0;font-size:.88rem;font-weight:600}
.aviso-edicao .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.aviso-edicao button{border:1.5px solid #2b2200;background:transparent;border-radius:8px;padding:2px 10px;font-weight:700;color:#2b2200}
.palco{padding:18px 0 48px}

/* Folha: sempre “papel”, mesmo no modo escuro */
.folha{--papel:#fff;--tinta:#1b1b1b;--fino:#8a8a8a;background:var(--papel);color:var(--tinta);max-width:820px;margin:0 auto;border-radius:6px;box-shadow:var(--sombra);padding:28px clamp(16px,5vw,44px) 36px;font-family:var(--serif);font-size:1.02rem;line-height:1.6}
.folha.editando{outline:3px dashed var(--gold);outline-offset:4px;cursor:text}
.folha h1,.folha h2,.folha h3{font-family:var(--sans)}
.faixa-prof{display:none;font-family:var(--sans);font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#2c5a1a;background:#e9f2d9;border-radius:6px;padding:4px 10px;margin:0 0 12px;width:max-content;max-width:100%}
.folha.prof .faixa-prof{display:block}
.f-cab{font-family:var(--sans);font-size:.82rem;display:grid;gap:8px;margin-bottom:14px}
.f-cab .lin{display:flex;gap:12px;flex-wrap:wrap}
.f-cab label{display:flex;gap:6px;align-items:baseline;flex:1 1 120px;min-width:0;color:#444}
.f-cab label.g{flex:3 1 220px}
.f-cab input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--fino);background:transparent;color:var(--tinta);padding:2px 2px;font:inherit;border-radius:0}
.f-cab input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.f-tit{font-size:clamp(1.3rem,4.6vw,1.75rem);line-height:1.2;margin:14px 0 4px;text-wrap:balance}
.f-sub{font-family:var(--sans);font-size:.85rem;color:#555;margin:0 0 16px;padding-bottom:12px;border-bottom:2px solid #1b1b1b}
.folha h2{font-size:1rem;margin:20px 0 6px;letter-spacing:.01em}
.instr{font-family:var(--sans);font-size:.92rem;background:#f4f1e6;border-left:4px solid var(--gold);padding:8px 12px;margin:12px 0;border-radius:0 6px 6px 0}
.texto{margin:14px 0;padding:12px 16px;border:1px solid #d6d2c0;border-radius:6px;background:#fcfbf6}
.texto h2{margin-top:2px}
.texto p{margin:0 0 .7em;text-align:left}
.texto p.fonte,.ctx p.fonte{font-family:var(--sans);font-size:.78rem;color:#666;margin:-2px 0 8px}
.texto p:last-child{margin-bottom:0}
.teoria{margin:14px 0;padding:10px 16px;border:1.5px solid #1b1b1b;border-radius:6px}
.teoria ul{margin:4px 0;padding-left:1.2rem}
.teoria li{margin:.35em 0}
.tab-wrap{overflow-x:auto;margin:6px 0 14px}
table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:.88rem}
th,td{border:1px solid #9a9a9a;padding:6px 8px;text-align:left;vertical-align:top}
th{background:#ece7d2}
td.escrever{height:2.4rem}
.q{margin:14px 0 18px;break-inside:avoid}
.q .enun{margin:0 0 6px}
.q .num{font-family:var(--sans);font-weight:800;margin-right:4px}
.ctx{margin:0 0 8px;padding:8px 12px;border-left:3px solid #bbb;background:#faf8f1;font-size:.96rem}
.ctx p{margin:0 0 .4em}
.alts{list-style:none;margin:0;padding:0 0 0 1.4rem}
.alts li{display:flex;gap:8px;margin:3px 0;padding:2px 6px;border-radius:5px}
.alts .letra{font-family:var(--sans);font-weight:800;flex:none;width:1.3em}
.folha.prof .alts li.certa{background:#e9f2d9;font-weight:700}
.linha-esc{display:block;border-bottom:1px solid #9a9a9a;height:1.9rem}
.escrita{margin:8px 0 0 1.4rem}
.gab{display:none;font-family:var(--sans);font-size:.85rem;background:#e9f2d9;border-left:4px solid #3f6b2a;padding:6px 10px;margin:8px 0 0 1.4rem;border-radius:0 6px 6px 0;color:#1d3a10}
.folha.prof .gab{display:block}
.somente-prof{display:none}
.folha.prof .somente-prof,.slides.prof .somente-prof{display:block}
.folha.prof th.somente-prof,.folha.prof td.somente-prof{display:table-cell}
.box-prof{font-family:var(--sans);font-size:.9rem;background:#e9f2d9;border:1px solid #9cc07a;border-radius:6px;padding:8px 16px;margin:16px 0}
.box-prof ul{margin:4px 0;padding-left:1.2rem}
.box-prof li{margin:.35em 0}
.plano{margin:14px 0}
.plano ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plano li{display:flex;gap:12px;align-items:flex-start;font-family:var(--sans);font-size:.92rem;border:1px solid #d6d2c0;border-radius:8px;padding:8px 12px;background:#fcfbf6}
.plano .min{flex:none;min-width:3.6rem;text-align:center;background:#2f3b21;color:#f6f0df;border-radius:6px;padding:3px 6px;font-weight:800;font-size:.8rem}
.plano p{margin:2px 0 0}
.resumo-gab{font-family:var(--sans);margin-top:18px;padding:10px 14px;border:1.5px solid #3f6b2a;border-radius:6px;background:#f3f9ea}
.resumo-gab p{margin:4px 0;word-spacing:.5em}
.folha .linhas{margin:14px 0}

/* ---------- Slides ---------- */
.slides{max-width:980px;margin:0 auto}
.stage{container-type:inline-size;aspect-ratio:16/9;width:100%;background:var(--card);border-radius:12px;box-shadow:var(--sombra);overflow:hidden;position:relative;border:1px solid var(--line)}
.stage:focus-visible{outline-offset:3px}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:5cqw 7cqw;background:#fffaf0;color:#26301a;font-family:var(--serif);border-left:2.2cqw solid #d9ab3a}
.slide h2{font-family:var(--serif);font-size:5cqw;line-height:1.1;margin:0 0 2.2cqw;color:#2f3b21}
.slide ul{margin:0;padding-left:3.4cqw;font-size:2.9cqw;line-height:1.3}
.slide li{margin:.5cqw 0}
.slide .ex{margin:2.4cqw 0 0;padding:1.4cqw 2.2cqw;background:#f1dc9a;border-radius:1cqw;font-size:2.5cqw;font-style:italic;color:#3d2f00}
.slide.capa{background:#2f3b21;color:#f6f0df;justify-content:center;border-left-color:#d9ab3a}
.slide.capa h2{color:#f6f0df;font-size:7.4cqw;margin-bottom:2cqw}
.slide.capa .sub{font-size:3.2cqw;color:#f1dc9a;margin:0;font-family:var(--sans)}
.nav-slides{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:12px 0}
.nav-slides button{border:1.5px solid var(--olive);background:var(--card);border-radius:10px;min-width:44px;min-height:44px;padding:0 14px;font-weight:700}
.nav-slides button:disabled{opacity:.4;cursor:default}
.nav-slides .pos{min-width:64px;text-align:center;font-weight:700}
.nota{display:none;background:var(--ok-bg);border:1px solid var(--ok);color:var(--ink);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:.92rem}
.slides.prof .nota{display:block}
.slides.prof .nota:empty{display:none}
.stage:fullscreen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0;border:0}
.imprimir-slides{display:none}

/* ---------- Mapa mental ---------- */
.folha.mapa-folha{max-width:1080px}
.mapa{display:grid;grid-template-columns:minmax(0,1fr) 190px minmax(0,1fr);column-gap:20px;row-gap:14px;align-items:center;font-family:var(--sans);margin-top:14px}
.centro{grid-column:2;display:grid;place-items:center;text-align:center;align-self:center;background:#2f3b21;color:#f6f0df;border-radius:999px;padding:22px 18px;font-family:var(--serif);font-weight:700;font-size:1.25rem;line-height:1.2;box-shadow:inset 0 0 0 4px #d9ab3a;position:relative;z-index:1}
.ramo{--c:#3f6b2a;position:relative;border:1.5px solid var(--c);border-left-width:6px;border-radius:10px;padding:8px 12px;background:#fcfbf6;font-size:.88rem;min-width:0;overflow-wrap:anywhere}
.ramo h3{margin:0 0 4px;font-size:.95rem;color:#1b1b1b}
.ramo ul{margin:0;padding-left:1.1rem}
.ramo li{margin:2px 0}
.ramo.esq{grid-column:1}
.ramo.dir{grid-column:3}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.cmp h4{margin:0 0 2px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:#555}
.cmp>div+div{border-left:1px dashed #aaa;padding-left:8px}
.c0{--c:#3f6b2a}.c1{--c:#a2741a}.c2{--c:#a14a36}.c3{--c:#2f5d7a}.c4{--c:#6a3f7a}.c5{--c:#4a6b5c}
@media (max-width:759px){
  .mapa{grid-template-columns:1fr}
  .centro{grid-column:1;order:-1;border-radius:20px}
  .ramo.esq,.ramo.dir{grid-column:1;grid-row:auto!important}
}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--olive);color:var(--on-olive);padding:10px 18px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .15s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- Impressão ---------- */
@page{size:A4;margin:14mm}
@page paisagem{size:A4 landscape;margin:10mm}
@media print{
  html,body{background:#fff!important;color:#000;min-height:0!important;height:auto!important}
  .barra,.topo,.skip,#toast,.rodape,.aviso-edicao,.nav-slides,.nota,.stage,.no-print{display:none!important}
  .palco{padding:0}
  .wrap{max-width:none;padding:0}
  .folha{box-shadow:none;border-radius:0;max-width:none;padding:0;font-size:11pt}
  .folha.editando{outline:0}
  .f-sub{margin-bottom:10px}
  .q,.texto,.teoria,.plano li,.instr,.box-prof{break-inside:avoid}
  h2{break-after:avoid}
  .folha.mapa-folha{page:paisagem}
  .imprimir-slides{display:block;page:paisagem}
  .imprimir-slides .slide-box{container-type:inline-size;aspect-ratio:16/9;width:100%;position:relative;break-after:page;break-inside:avoid;border:1px solid #bbb}
  .imprimir-slides .slide-box:last-child{break-after:auto}
  .ramo,.centro,.pasta,.beneficios li{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .slide,.slide.capa,.slide .ex,.plano .min,th,.faixa-prof,.gab,.box-prof,.alts li.certa,.resumo-gab{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

<script src="dados-8d.js"></script>
<script src="dados-8e.js"></script>
<script src="dados-9a.js"></script>
<script src="dados-9b.js"></script>
<script src="dados-9c.js"></script>
<script src="dados-9d.js"></script>
<script src="dados-9e.js"></script>
<script>
(function () {
  "use strict";

  var DB = window.BIBLIOTECA;
  var MAT = DB.materiais;
  var app = document.getElementById("app");
  var toastEl = document.getElementById("toast");

  var TIPOS = [
    { id: "atividade", nome: "Atividades" },
    { id: "prova", nome: "Provas" },
    { id: "slides", nome: "Slides" },
    { id: "mapa", nome: "Mapas mentais" },
    { id: "simulado", nome: "Simulados" },
    { id: "interpretacao", nome: "Interpretação" },
    { id: "gramatica", nome: "Gramática" },
    { id: "emergencia", nome: "Aula de emergência" }
  ];
  var SERIES = [
    { id: "6", nome: "6º ano" }, { id: "7", nome: "7º ano" }, { id: "8", nome: "8º ano" },
    { id: "9", nome: "9º ano" }, { id: "EM", nome: "Ensino Médio" }
  ];
  var ASSUNTOS = ["Gramática", "Interpretação", "Literatura", "Redação"];
  var LETRAS = "ABCDEFGH";

  /* ---------- Ícones (traço, herdam a cor) ---------- */
  var ICONES = {
    atividade: '<rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 3.5h6V7H9z"/><path d="M8.5 14l2.2 2.2 4.3-4.6"/>',
    prova: '<path d="M5 20.5h14"/><path d="M6 17l9.5-9.5 3 3L9 20H6z"/><path d="M13.5 9.5l3 3"/>',
    slides: '<rect x="3" y="4" width="18" height="12" rx="1.6"/><path d="M12 16v4M8 20h8"/><path d="M7 12.5l3-3 3 2 3.5-4"/>',
    mapa: '<circle cx="12" cy="12" r="2.6"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><path d="M10.2 10.4L6.6 7.4M13.8 10.4l3.6-3M10.2 13.6l-3.6 3M13.8 13.6l3.6 3"/>',
    simulado: '<path d="M2.5 9.5L12 5l9.5 4.5L12 14z"/><path d="M6 11.7V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.3"/><path d="M21.5 9.5V15"/>',
    interpretacao: '<path d="M12 6.2C10 4.7 7 4.2 4 4.2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2v-14c-3 0-6 .5-8 2z"/><path d="M12 6.2v14"/>',
    gramatica: '<rect x="4" y="3.5" width="14" height="4" rx="1"/><rect x="3" y="9.5" width="16" height="4" rx="1"/><rect x="5.5" y="15.5" width="15" height="4" rx="1"/>',
    emergencia: '<path d="M7 18v-5a5 5 0 0110 0v5"/><path d="M5 18h14v3H5z"/><path d="M12 3v2M4.6 6.4L6 7.8M19.4 6.4L18 7.8"/>',
    busca: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
    estrela: '<path d="M12 3.6l2.5 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8 6.9 19.6l1-5.8-4.2-4.1 5.8-.8z"/>'
  };
  function svg(nome, tam) {
    tam = tam || 24;
    return '<svg viewBox="0 0 24 24" width="' + tam + '" height="' + tam + '" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + ICONES[nome] + "</svg>";
  }
  var LOGO = '<svg viewBox="0 0 40 40" width="36" height="36" aria-hidden="true" focusable="false"><rect width="40" height="40" rx="10" fill="#2f3b21"/><path d="M20 12.5c-2.4-1.8-5.8-2.4-9-2.4v16.5c3.2 0 6.6.6 9 2.4 2.4-1.8 5.8-2.4 9-2.4V10.1c-3.2 0-6.6.6-9 2.4z" fill="#f6f0df"/><path d="M20 12.5v16.5" stroke="#2f3b21" stroke-width="1.6"/><path d="M26.5 10.2v8l2.1-1.7 2.1 1.7v-8z" fill="#d9ab3a"/></svg>';

  /* ---------- Utilidades ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
  }
  function fmt(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\/\/(.+?)\/\//g, "<em>$1</em>")
      .replace(/\+\+(.+?)\+\+/g, "<u>$1</u>")
      .replace(/\n/g, "<br>");
  }
  function norm(s) { return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function nomeTipo(id) { for (var i = 0; i < TIPOS.length; i++) if (TIPOS[i].id === id) return TIPOS[i].nome; return id; }
  function rotuloSerie(a) {
    var nums = a.filter(function (x) { return x !== "EM"; }).sort();
    var partes = [];
    if (nums.length === 1) partes.push(nums[0] + "º ano");
    else if (nums.length === 2) partes.push(nums[0] + "º e " + nums[1] + "º ano");
    else if (nums.length > 2) partes.push(nums[0] + "º ao " + nums[nums.length - 1] + "º ano");
    if (a.indexOf("EM") >= 0) partes.push("Ensino Médio");
    return partes.join(" e ");
  }
  function colher(o, out) {
    if (typeof o === "string") out.push(o);
    else if (Array.isArray(o)) o.forEach(function (x) { colher(x, out); });
    else if (o && typeof o === "object") Object.keys(o).forEach(function (k) { if (k !== "g" && k !== "prof") colher(o[k], out); });
  }
  function questoes(m) {
    var n = 0;
    (m.blocos || []).forEach(function (b) { if (b.k === "q") n += b.it.length; });
    return n;
  }
  function meta(m) {
    if (m.slides) return m.slides.length + " slides";
    if (m.mapa) return m.mapa.ramos.length + " ramos";
    var q = questoes(m);
    var partes = [];
    if (q) partes.push(q + (q === 1 ? " questão" : " questões"));
    if (m.tempo) partes.push(m.tempo);
    return partes.join(" · ");
  }
  var porId = {};
  MAT.forEach(function (m) {
    porId[m.id] = m;
    var tx = [];
    colher(m, tx);
    m._idx = norm(tx.join(" ") + " " + nomeTipo(m.tipo) + " " + rotuloSerie(m.serie));
  });

  /* ---------- Armazenamento (falha silenciosa) ---------- */
  var CHAVE = "biblioteca-professor:v1";
  var store = (function () {
    var s = {};
    try { s = JSON.parse(localStorage.getItem(CHAVE)) || {}; } catch (e) { s = {}; }
    if (!s || typeof s !== "object") s = {};
    s.fav = Array.isArray(s.fav) ? s.fav.filter(function (x) { return typeof x === "string"; }) : [];
    s.escola = typeof s.escola === "string" ? s.escola.slice(0, 80) : "";
    s.prof = typeof s.prof === "string" ? s.prof.slice(0, 80) : "";
    s.versaoProf = s.versaoProf === true;
    return s;
  })();
  function salvar() { try { localStorage.setItem(CHAVE, JSON.stringify(store)); } catch (e) { /* sem armazenamento */ } }
  function ehFav(id) { return store.fav.indexOf(id) >= 0; }
  function alternarFav(id) {
    var i = store.fav.indexOf(id);
    if (i >= 0) store.fav.splice(i, 1); else store.fav.push(id);
    salvar();
    return i < 0;
  }

  var tTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("on");
    clearTimeout(tTimer);
    tTimer = setTimeout(function () { toastEl.classList.remove("on"); }, 2200);
  }

  /* ---------- Estado da vitrine ---------- */
  var F = { q: "", tipo: "", serie: "", assunto: "", fav: false };
  var homeScroll = 0;

  function casa(m, ignorarTipo) {
    if (!ignorarTipo && F.tipo && m.tipo !== F.tipo) return false;
    if (F.serie && m.serie.indexOf(F.serie) < 0) return false;
    if (F.assunto && m.assunto.indexOf(F.assunto) < 0) return false;
    if (F.fav && !ehFav(m.id)) return false;
    if (F.q) {
      var termos = norm(F.q).split(/\s+/).filter(Boolean);
      for (var i = 0; i < termos.length; i++) if (m._idx.indexOf(termos[i]) < 0) return false;
    }
    return true;
  }
  function ordem(a, b) {
    function si(m) { return Math.min.apply(null, m.serie.map(function (s) { return SERIES.map(function (x) { return x.id; }).indexOf(s); })); }
    function ti(m) { return TIPOS.map(function (x) { return x.id; }).indexOf(m.tipo); }
    return si(a) - si(b) || ti(a) - ti(b) || a.titulo.localeCompare(b.titulo, "pt-BR");
  }

  /* ---------- Vitrine ---------- */
  function home() {
    document.title = "Português Pronto · Biblioteca do Professor";
    slidesAtivo = null;
    var h = "";
    h += '<header class="topo"><div class="wrap">';
    h += '<div class="marca">' + LOGO + "<span>" + esc(DB.marca) + "</span></div>";
    h += '<div class="selo">Para professores de Português, Redação e Literatura</div>';
    h += "</div></header>";
    h += '<main id="principal" class="wrap" tabindex="-1">';
    h += '<section class="hero"><h1 id="titulo" tabindex="-1">' + MAT.length + " materiais de Português <mark>prontos para usar.</mark></h1>";
    h += "<p><strong>Sem perder horas preparando aulas.</strong> Filtre por ano, assunto ou tipo de material, abra, edite se quiser e imprima só o que vai usar. Do 6º ano ao Ensino Médio, com gabarito do professor e simulados.</p>";
    h += '<ul class="beneficios"><li>6º ano ao Ensino Médio</li><li>Editáveis</li><li>Imprima ou projete</li><li>Gabarito do professor</li></ul></section>';

    h += '<section class="vitrine" aria-label="Buscar e filtrar materiais">';
    h += '<div class="busca">' + svg("busca", 20) + '<label class="vh" for="q">Buscar materiais</label><input id="q" type="search" placeholder="Buscar materiais" autocomplete="off" value="' + esc(F.q) + '"></div>';
    h += '<div class="pastas" role="group" aria-label="Tipo de material">';
    TIPOS.forEach(function (t) {
      h += '<button type="button" class="pasta" data-tipo="' + t.id + '" aria-pressed="false">' + svg(t.id, 30) + '<span class="t">' + t.nome + '</span><span class="n"></span></button>';
    });
    h += "</div>";
    h += '<div class="filtros"><div class="pilulas" role="group" aria-label="Ano">';
    h += '<button type="button" class="pilula" data-serie="" aria-pressed="false">Todos os anos</button>';
    SERIES.forEach(function (s) { h += '<button type="button" class="pilula" data-serie="' + s.id + '" aria-pressed="false">' + s.nome + "</button>"; });
    h += "</div>";
    h += '<label class="vh" for="assunto">Assunto</label><select id="assunto"><option value="">Todos os assuntos</option>';
    ASSUNTOS.forEach(function (a) { h += '<option value="' + a + '">' + a + "</option>"; });
    h += "</select>";
    h += '<button type="button" class="chip" id="soFav" aria-pressed="false">★ Favoritos</button>';
    h += '<button type="button" class="limpar" id="limpar" hidden>Limpar filtros</button></div>';
    h += "</section>";

    h += '<section class="resultados" aria-label="Resultados"><h2 class="cont" id="cont" aria-live="polite"></h2><ul class="lista" id="lista"></ul></section>';
    h += "</main>";
    h += '<footer class="rodape"><div class="wrap">';
    h += "<p>Materiais originais, criados para uso em sala de aula. Os textos marcados como “Texto original” são fictícios, escritos para as atividades.</p>";
    h += "<p>Os textos de Camões, Machado de Assis, Gonçalves Dias, Casimiro de Abreu e Monteiro Lobato citados estão em domínio público.</p>";
    h += "<p>Sem vínculo com o Inep ou o MEC. ENEM é um exame do Inep.</p>";
    h += "</div></footer>";
    app.innerHTML = h;

    document.getElementById("q").addEventListener("input", function (e) { F.q = e.target.value; atualizar(); });
    app.querySelector(".pastas").addEventListener("click", function (e) {
      var b = e.target.closest("[data-tipo]"); if (!b) return;
      F.tipo = F.tipo === b.getAttribute("data-tipo") ? "" : b.getAttribute("data-tipo");
      atualizar();
    });
    app.querySelector(".pilulas").addEventListener("click", function (e) {
      var b = e.target.closest("[data-serie]"); if (!b) return;
      F.serie = b.getAttribute("data-serie");
      atualizar();
    });
    document.getElementById("assunto").addEventListener("change", function (e) { F.assunto = e.target.value; atualizar(); });
    document.getElementById("soFav").addEventListener("click", function () { F.fav = !F.fav; atualizar(); });
    document.getElementById("limpar").addEventListener("click", limpar);
    document.getElementById("lista").addEventListener("click", function (e) {
      var b = e.target.closest(".fav"); if (!b) return;
      var id = b.getAttribute("data-id");
      var agora = alternarFav(id);
      b.setAttribute("aria-pressed", String(agora));
      toast(agora ? "Adicionado aos favoritos" : "Removido dos favoritos");
      if (F.fav) atualizar();
    });
    atualizar();
    window.scrollTo(0, homeScroll);
  }
  function limpar() {
    F = { q: "", tipo: "", serie: "", assunto: "", fav: false };
    document.getElementById("q").value = "";
    document.getElementById("assunto").value = "";
    atualizar();
  }
  function atualizar() {
    var lista = MAT.filter(function (m) { return casa(m, false); }).sort(ordem);
    TIPOS.forEach(function (t) {
      var b = app.querySelector('[data-tipo="' + t.id + '"]');
      var n = MAT.filter(function (m) { return m.tipo === t.id && casa(m, true); }).length;
      b.setAttribute("aria-pressed", String(F.tipo === t.id));
      b.querySelector(".n").textContent = n + (n === 1 ? " material" : " materiais");
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-serie]"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-serie") === F.serie));
    });
    document.getElementById("assunto").value = F.assunto;
    document.getElementById("soFav").setAttribute("aria-pressed", String(F.fav));
    var filtrando = !!(F.q || F.tipo || F.serie || F.assunto || F.fav);
    document.getElementById("limpar").hidden = !filtrando;
    document.getElementById("cont").textContent = filtrando
      ? lista.length + (lista.length === 1 ? " material encontrado" : " materiais encontrados") + " (de " + MAT.length + ")"
      : MAT.length + " materiais";
    var h = "";
    if (!lista.length) {
      h = '<li class="vazio" style="grid-column:1/-1"><p>' + (F.fav && !store.fav.length ? "Você ainda não marcou favoritos. Toque na estrela de um material para guardá-lo aqui." : "Nenhum material com esses filtros.") + '</p><button type="button" class="btn" id="vazioLimpar">Limpar filtros</button></li>';
    }
    lista.forEach(function (m) {
      h += '<li class="item"><a class="card" href="#/m/' + esc(m.id) + '"><span class="ic">' + svg(m.tipo, 26) + "</span><span>";
      h += '<span class="tit">' + esc(m.titulo) + '</span><span class="res">' + esc(m.resumo) + "</span>";
      h += '<span class="tags"><span>' + esc(nomeTipo(m.tipo)) + "</span><span>" + esc(rotuloSerie(m.serie)) + "</span>" + (m.assunto[0] !== nomeTipo(m.tipo) ? "<span>" + esc(m.assunto[0]) + "</span>" : "");
      var mt = meta(m);
      if (mt) h += "<span>" + esc(mt) + "</span>";
      h += "</span></span></a>";
      h += '<button type="button" class="fav" data-id="' + esc(m.id) + '" aria-pressed="' + ehFav(m.id) + '" aria-label="Favoritar: ' + esc(m.titulo) + '">' + svg("estrela", 22) + "</button></li>";
    });
    document.getElementById("lista").innerHTML = h;
    var vl = document.getElementById("vazioLimpar");
    if (vl) vl.addEventListener("click", limpar);
  }

  /* ---------- Leitor: folha ---------- */
  function celula(c, th) {
    var tag = th ? "th" : "td";
    var txt = c, cls = [];
    if (c && typeof c === "object") { txt = c.t; if (c.prof) cls.push("somente-prof"); }
    if (!th && (txt === "" || txt == null)) cls.push("escrever");
    return "<" + tag + (cls.length ? ' class="' + cls.join(" ") + '"' : "") + ">" + fmt(txt == null ? "" : txt) + "</" + tag + ">";
  }
  function linhasEsc(n) {
    var h = '<div class="escrita" aria-hidden="true">';
    for (var i = 0; i < n; i++) h += '<span class="linha-esc"></span>';
    return h + "</div>";
  }
  function folhaHTML(m) {
    var n = 0, gab = [];
    var h = '<article class="folha raiz" id="folha" aria-labelledby="titulo">';
    h += '<p class="faixa-prof">Versão do professor · com gabarito</p>';
    h += '<div class="f-cab"><div class="lin"><label class="g">Escola <input id="inEscola" maxlength="80" value="' + esc(store.escola) + '"></label><label>Professor(a) <input id="inProf" maxlength="80" value="' + esc(store.prof) + '"></label></div>';
    h += '<div class="lin"><label class="g">Nome <input maxlength="80"></label><label>Turma <input maxlength="12"></label><label>Data <input maxlength="12"></label><label>Nº <input maxlength="3"></label></div></div>';
    h += '<h1 class="f-tit" id="titulo" tabindex="-1">' + esc(m.titulo) + "</h1>";
    h += '<p class="f-sub">' + esc([nomeTipo(m.tipo), rotuloSerie(m.serie), m.assunto.join(" e "), m.tempo].filter(Boolean).join(" · ")) + "</p>";
    m.blocos.forEach(function (b) {
      switch (b.k) {
        case "instr":
          h += '<p class="instr">' + fmt(b.p) + "</p>"; break;
        case "texto":
          h += '<section class="texto"><h2>' + esc(b.t) + "</h2>";
          if (b.fonte) h += '<p class="fonte">' + esc(b.fonte) + "</p>";
          b.p.forEach(function (p) { h += "<p>" + fmt(p) + "</p>"; });
          h += "</section>"; break;
        case "teoria":
          h += '<section class="teoria"><h2>' + esc(b.t) + "</h2><ul>";
          b.li.forEach(function (l) { h += "<li>" + fmt(l) + "</li>"; });
          h += "</ul></section>"; break;
        case "tabela":
          h += '<section class="tab">' + (b.t ? "<h2>" + esc(b.t) + "</h2>" : "") + '<div class="tab-wrap"><table><thead><tr>';
          b.cab.forEach(function (c) { h += celula(c, true); });
          h += "</tr></thead><tbody>";
          b.l.forEach(function (r) { h += "<tr>"; r.forEach(function (c) { h += celula(c, false); }); h += "</tr>"; });
          h += "</tbody></table></div></section>"; break;
        case "q":
          if (b.t) h += "<h2>" + esc(b.t) + "</h2>";
          b.it.forEach(function (q) {
            n++;
            h += '<div class="q">';
            if (q.ctx) {
              h += '<div class="ctx"><p>' + fmt(q.ctx) + "</p>" + (q.fonte ? '<p class="fonte">' + esc(q.fonte) + "</p>" : "") + "</div>";
            }
            h += '<p class="enun"><span class="num">' + n + ".</span> " + fmt(q.e) + "</p>";
            if (q.alt) {
              h += '<ol class="alts" style="list-style:none">';
              q.alt.forEach(function (a, i) {
                h += "<li" + (i === q.g ? ' class="certa"' : "") + '><span class="letra">' + LETRAS[i] + ")</span><span>" + fmt(a) + "</span></li>";
              });
              h += "</ol>";
              gab.push(n + " · " + LETRAS[q.g]);
              h += '<div class="gab"><strong>Gabarito: ' + LETRAS[q.g] + ".</strong>" + (q.c ? " " + fmt(q.c) : "") + "</div>";
            } else {
              h += linhasEsc(q.l || 3);
              h += '<div class="gab"><strong>Resposta-modelo:</strong> ' + fmt(q.r) + "</div>";
            }
            h += "</div>";
          });
          break;
        case "plano":
          h += '<section class="plano somente-prof"><h2>' + esc(b.t) + "</h2><ol>";
          b.et.forEach(function (e) {
            h += '<li><span class="min">' + esc(e.min) + " min</span><div><strong>" + esc(e.t) + "</strong><p>" + fmt(e.d) + "</p></div></li>";
          });
          h += "</ol></section>"; break;
        case "linhas":
          h += '<section class="linhas">' + (b.t ? "<h2>" + esc(b.t) + "</h2>" : "") + linhasEsc(b.n || 10) + "</section>"; break;
        case "prof":
          h += '<section class="box-prof somente-prof"><h2>' + esc(b.t) + "</h2><ul>";
          b.li.forEach(function (l) { h += "<li>" + fmt(l) + "</li>"; });
          h += "</ul></section>"; break;
      }
    });
    if (gab.length) {
      h += '<section class="resumo-gab somente-prof"><h2>Gabarito das objetivas</h2><p>' + gab.map(esc).join("&emsp;") + "</p></section>";
    }
    return h + "</article>";
  }

  /* ---------- Leitor: slides ---------- */
  var slidesAtivo = null;
  function slideHTML(s) {
    if (s.capa) return '<div class="slide capa"><h2>' + esc(s.t) + "</h2>" + (s.sub ? '<p class="sub">' + esc(s.sub) + "</p>" : "") + "</div>";
    var h = '<div class="slide"><h2>' + esc(s.t) + "</h2>";
    if (s.li) { h += "<ul>"; s.li.forEach(function (l) { h += "<li>" + fmt(l) + "</li>"; }); h += "</ul>"; }
    if (s.ex) h += '<p class="ex">' + fmt(s.ex) + "</p>";
    return h + "</div>";
  }
  function slidesHTML(m) {
    var h = '<div class="slides raiz" id="slides">';
    h += '<h1 class="vh" id="titulo" tabindex="-1">' + esc(m.titulo) + "</h1>";
    h += '<div class="stage" id="stage" tabindex="0" role="group" aria-roledescription="apresentação" aria-label="' + esc(m.titulo) + '"></div>';
    h += '<div class="nav-slides no-print"><button type="button" id="ant" aria-label="Slide anterior">‹</button><span class="pos" id="pos" aria-live="polite"></span><button type="button" id="prox" aria-label="Próximo slide">›</button><button type="button" id="tela">Tela cheia</button></div>';
    h += '<div class="nota" id="nota" aria-label="Notas do professor"></div>';
    h += '<div class="imprimir-slides" aria-hidden="true">';
    m.slides.forEach(function (s) { h += '<div class="slide-box">' + slideHTML(s) + "</div>"; });
    h += "</div></div>";
    return h;
  }
  function ligarSlides(m) {
    var cur = 0, total = m.slides.length;
    var stage = document.getElementById("stage");
    function mostrar(i) {
      cur = Math.max(0, Math.min(total - 1, i));
      stage.innerHTML = slideHTML(m.slides[cur]);
      document.getElementById("pos").textContent = (cur + 1) + " / " + total;
      document.getElementById("ant").disabled = cur === 0;
      document.getElementById("prox").disabled = cur === total - 1;
      var nota = m.slides[cur].nota;
      document.getElementById("nota").innerHTML = nota ? "<strong>Nota do professor:</strong> " + fmt(nota) : "";
    }
    document.getElementById("ant").addEventListener("click", function () { mostrar(cur - 1); });
    document.getElementById("prox").addEventListener("click", function () { mostrar(cur + 1); });
    document.getElementById("tela").addEventListener("click", function () {
      if (stage.requestFullscreen) stage.requestFullscreen().catch(function () { toast("Não foi possível abrir em tela cheia"); });
      else toast("Tela cheia indisponível neste navegador");
    });
    slidesAtivo = { prev: function () { mostrar(cur - 1); }, next: function () { mostrar(cur + 1); }, first: function () { mostrar(0); }, last: function () { mostrar(total - 1); } };
    mostrar(0);
  }
  document.addEventListener("keydown", function (e) {
    if (!slidesAtivo || e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target && e.target.tagName;
    if (t === "INPUT" || t === "SELECT" || t === "TEXTAREA" || (e.target && e.target.isContentEditable)) return;
    var k = e.key;
    if (k === "ArrowRight" || k === "PageDown") { slidesAtivo.next(); e.preventDefault(); }
    else if (k === "ArrowLeft" || k === "PageUp") { slidesAtivo.prev(); e.preventDefault(); }
    else if (k === "Home") { slidesAtivo.first(); e.preventDefault(); }
    else if (k === "End") { slidesAtivo.last(); e.preventDefault(); }
  });

  /* ---------- Leitor: mapa mental ---------- */
  function mapaHTML(m) {
    var mp = m.mapa, n = mp.ramos.length, esq = Math.ceil(n / 2), ie = 0, id = 0;
    var h = '<article class="folha raiz mapa-folha" id="folha" aria-labelledby="titulo">';
    h += '<h1 class="f-tit" id="titulo" tabindex="-1">' + esc(m.titulo) + "</h1>";
    h += '<p class="f-sub">' + esc([nomeTipo(m.tipo), rotuloSerie(m.serie), m.assunto.join(" e ")].join(" · ")) + "</p>";
    h += '<div class="mapa"><div class="centro" style="grid-row:1 / span ' + esq + '">' + esc(mp.centro) + "</div>";
    mp.ramos.forEach(function (r, i) {
      var lado = i % 2 === 0 ? "esq" : "dir";
      var linha = (lado === "esq" ? ++ie : ++id);
      h += '<div class="ramo ' + lado + " c" + (i % 6) + '" style="grid-row:' + linha + '"><h3>' + esc(r.t) + "</h3>";
      if (r.itens) {
        h += "<ul>"; r.itens.forEach(function (x) { h += "<li>" + fmt(x) + "</li>"; }); h += "</ul>";
      } else {
        h += '<div class="cmp">';
        [["a", 0], ["b", 1]].forEach(function (p) {
          h += "<div><h4>" + esc(mp.rotulos ? mp.rotulos[p[1]] : p[0]) + "</h4><ul>";
          r[p[0]].forEach(function (x) { h += "<li>" + fmt(x) + "</li>"; });
          h += "</ul></div>";
        });
        h += "</div>";
      }
      h += "</div>";
    });
    return h + "</div></article>";
  }

  /* ---------- Leitor: barra e ações ---------- */
  function temProf(m) {
    if (m.slides) return m.slides.some(function (s) { return !!s.nota; });
    if (m.mapa) return false;
    return m.blocos.some(function (b) { return b.k === "q" || b.k === "prof" || b.k === "plano" || b.k === "tabela" && JSON.stringify(b).indexOf('"prof":true') >= 0; });
  }
  function copiarTexto(txt) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt);
    return new Promise(function (ok, erro) {
      var ta = document.createElement("textarea");
      ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy") ? ok() : erro(); } catch (e) { erro(e); }
      document.body.removeChild(ta);
    });
  }
  function abrir(id) {
    var m = porId[id];
    if (!m) { location.replace("#/"); return; }
    if (app.querySelector(".resultados")) homeScroll = window.scrollY;
    slidesAtivo = null;
    document.title = m.titulo + " · " + DB.marca;
    var inicioProf = m.tipo === "emergencia" ? true : store.versaoProf;
    var ehSlides = !!m.slides, ehMapa = !!m.mapa;

    var h = '<div class="barra no-print"><div class="wrap"><a class="voltar" href="#/">← Biblioteca</a><div class="acoes">';
    if (temProf(m)) h += '<label class="chave" id="chave"><input type="checkbox" id="profChk"> Versão do professor</label>';
    if (!ehSlides) h += '<button type="button" id="btnEditar" aria-pressed="false">Editar</button><button type="button" id="btnCopiar">Copiar</button>';
    h += '<button type="button" id="btnImprimir" class="prim">Imprimir / PDF</button>';
    h += '<button type="button" id="btnFav" aria-pressed="' + ehFav(m.id) + '">★ <span>' + (ehFav(m.id) ? "Favorito" : "Favoritar") + "</span></button>";
    h += '</div></div></div><div class="aviso-edicao no-print" id="avisoEd" hidden><div class="wrap"><span role="status">Modo de edição: clique no texto para alterar. As mudanças valem só para esta impressão.</span><button type="button" id="btnRestaurar">Restaurar original</button></div></div>';
    h += '<main id="principal" class="palco" tabindex="-1"><div class="wrap">' + (ehSlides ? slidesHTML(m) : ehMapa ? mapaHTML(m) : folhaHTML(m)) + "</div></main>";
    app.innerHTML = h;

    var raiz = app.querySelector(".raiz");
    function aplicarProf(on) {
      raiz.classList.toggle("prof", on);
      var chk = document.getElementById("profChk");
      if (chk) { chk.checked = on; document.getElementById("chave").classList.toggle("on", on); }
    }
    aplicarProf(inicioProf && temProf(m));
    var chk = document.getElementById("profChk");
    if (chk) chk.addEventListener("change", function () {
      aplicarProf(chk.checked);
      if (m.tipo !== "emergencia") { store.versaoProf = chk.checked; salvar(); }
    });

    document.getElementById("btnImprimir").addEventListener("click", function () { window.print(); });
    document.getElementById("btnFav").addEventListener("click", function () {
      var agora = alternarFav(m.id);
      this.setAttribute("aria-pressed", String(agora));
      this.querySelector("span").textContent = agora ? "Favorito" : "Favoritar";
      toast(agora ? "Adicionado aos favoritos" : "Removido dos favoritos");
    });

    if (ehSlides) ligarSlides(m);
    else {
      document.getElementById("btnCopiar").addEventListener("click", function () {
        var txt = raiz.innerText.replace(/\n{3,}/g, "\n\n").trim();
        copiarTexto(txt).then(function () { toast("Texto copiado"); }, function () { toast("Não foi possível copiar"); });
      });
      var btnEd = document.getElementById("btnEditar");
      function editar(on) {
        raiz.classList.toggle("editando", on);
        if (on) raiz.setAttribute("contenteditable", "true"); else raiz.removeAttribute("contenteditable");
        btnEd.setAttribute("aria-pressed", String(on));
        btnEd.textContent = on ? "Concluir edição" : "Editar";
        document.getElementById("avisoEd").hidden = !on;
      }
      btnEd.addEventListener("click", function () { editar(btnEd.getAttribute("aria-pressed") !== "true"); });
      document.getElementById("btnRestaurar").addEventListener("click", function () {
        var prof = raiz.classList.contains("prof");
        var novo = document.createElement("div");
        novo.innerHTML = ehMapa ? mapaHTML(m) : folhaHTML(m);
        raiz.replaceWith(novo.firstChild);
        raiz = app.querySelector(".raiz");
        raiz.classList.toggle("prof", prof);
        ligarCabecalho();
        editar(false);
        toast("Material restaurado");
      });
      ligarCabecalho();
    }
    function ligarCabecalho() {
      var e = document.getElementById("inEscola"), p = document.getElementById("inProf");
      if (e) e.addEventListener("input", function () { store.escola = e.value.slice(0, 80); salvar(); });
      if (p) p.addEventListener("input", function () { store.prof = p.value.slice(0, 80); salvar(); });
    }
    window.scrollTo(0, 0);
    var alvo = document.getElementById("titulo");
    if (alvo) alvo.focus({ preventScroll: true });
  }

  /* ---------- Rotas ---------- */
  function rota() {
    var mm = location.hash.match(/^#\/m\/([\w-]+)/);
    if (mm) abrir(mm[1]); else home();
  }
  window.addEventListener("hashchange", rota);
  window.addEventListener("beforeprint", function () {
    /* a escola/professor digitados já estão nos inputs; nada a fazer além de garantir foco fora de campos */
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  });
  rota();
})();
</script>
